name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Publish only the site itself. Templates, the design-system artifact source
      # and the Markdown docs stay in the repo but are not served.
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html 404.html styleguide.html favicon.svg apple-touch-icon.png css da _site/
          for dir in */; do
            dir="${dir%/}"
            case "$dir" in
              _site|_template|css|da|design-system) continue ;;
            esac
            if [ -f "$dir/index.html" ]; then
              cp -r "$dir" _site/
            fi
          done
          echo "Published files:"
          find _site -type f | sort

      - name: Check for leftover template placeholders
        run: |
          if grep -rl '{{' _site; then
            echo "::error::Found {{placeholders}} in the files above. Replace them before deploying."
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
