name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Publish only the site itself. Templates, the design-system artifact source
      # and the Markdown docs stay in the repo but are not served.
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html 404.html styleguide.html favicon.svg apple-touch-icon.png css fonts da _site/
          for dir in */; do
            dir="${dir%/}"
            case "$dir" in
              _site|_template|css|fonts|da|design-system) continue ;;
            esac
            if [ -f "$dir/index.html" ]; then
              cp -r "$dir" _site/
            fi
          done
          echo "Published files:"
          find _site -type f | sort

      # A standalone in-app page (<slug>/app/) must say exactly the same as the
      # normal policy page one folder up, from the title to the end of the article.
      - name: Check standalone pages match their policy page
        shell: bash
        run: |
          extract() { sed -n '/class="policy__title"/,/<\/article>/p' "$1"; }
          status=0
          while IFS= read -r app; do
            main="$(dirname "$(dirname "$app")")/index.html"
            if ! diff <(extract "$main") <(extract "$app"); then
              echo "::error file=$app::Policy text differs from $main. Update both pages."
              status=1
            fi
          done < <(find _site -path '*/app/index.html')
          exit $status

      - name: Check for leftover template placeholders
        run: |
          if grep -rl '{{' _site; then
            echo "::error::Found {{placeholders}} in the files above. Replace them before deploying."
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
